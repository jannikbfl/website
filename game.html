<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balkonkraftwerk Idle</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    
    <div class="max-w-4xl mx-auto bg-slate-800 border border-slate-700 rounded-3xl p-6 md:p-10 shadow-2xl relative">
        
        <!-- Zurück-Button -->
        <a href="index.html" class="absolute top-6 left-6 flex items-center gap-2 text-sm text-slate-400 hover:text-white transition bg-slate-900/50 py-2 px-4 rounded-full">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Zurück
        </a>

        <!-- Header -->
        <div class="text-center mt-12 mb-10">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 mb-2">Balkonkraftwerk Idle</h1>
            <p class="text-slate-400 text-sm">Produziere Strom, automatisiere dein Setup und optimiere dein Smart Home.</p>
        </div>

        <!-- Main Game Area -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Clicker & Stats -->
            <div class="flex flex-col items-center justify-center space-y-6 bg-gradient-to-b from-slate-700/40 to-slate-800/80 p-8 rounded-2xl border border-slate-600 shadow-inner">
                
                <!-- Sonnen-Icon -->
                <div class="w-24 h-24 text-yellow-400 animate-[spin_10s_linear_infinite]">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                    </svg>
                </div>

                <div class="text-center">
                    <div class="text-6xl font-black text-white drop-shadow-[0_0_15px_rgba(250,204,21,0.4)] my-2">
                        <span id="energy-display">0</span> <span class="text-3xl text-yellow-500">Wh</span>
                    </div>
                    <div class="text-sm text-emerald-400 font-medium bg-emerald-900/30 px-3 py-1 rounded-full inline-block">
                        Produktion: <span id="eps-display" class="font-bold">0</span> Wh/s
                    </div>
                </div>

                <button id="click-btn" class="mt-6 w-full py-5 bg-gradient-to-r from-yellow-500 to-amber-500 hover:from-yellow-400 hover:to-amber-400 text-slate-900 font-extrabold text-xl rounded-2xl shadow-[0_8px_25px_-5px_rgba(245,158,11,0.5)] transition transform active:scale-95 flex items-center justify-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    Sonne einfangen
                </button>
            </div>

            <!-- Upgrades -->
            <div class="space-y-4">
                <h2 class="text-xl font-bold border-b border-slate-700 pb-3 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                    Automatisierung
                </h2>
                
                <!-- Upgrade 1 -->
                <button id="buy-panel-btn" class="w-full flex justify-between items-center p-4 bg-slate-700/50 hover:bg-slate-600 rounded-xl transition border border-slate-600 disabled:opacity-50 disabled:cursor-not-allowed group">
                    <div class="flex items-center gap-4">
                        <div class="bg-blue-900/50 p-2 rounded-lg text-blue-400 group-hover:scale-110 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                            </svg>
                        </div>
                        <div class="text-left">
                            <div class="font-bold text-white">Solar-Panel</div>
                            <div class="text-xs text-blue-300 font-medium">+1 Wh/s</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-yellow-400 font-bold text-lg" id="panel-cost">15 Wh</div>
                        <div class="text-xs text-slate-400 font-medium">Besitz: <span id="panel-count" class="text-white">0</span></div>
                    </div>
                </button>

                <!-- Upgrade 2 -->
                <button id="buy-inverter-btn" class="w-full flex justify-between items-center p-4 bg-slate-700/50 hover:bg-slate-600 rounded-xl transition border border-slate-600 disabled:opacity-50 disabled:cursor-not-allowed group">
                    <div class="flex items-center gap-4">
                        <div class="bg-purple-900/50 p-2 rounded-lg text-purple-400 group-hover:scale-110 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
                            </svg>
                        </div>
                        <div class="text-left">
                            <div class="font-bold text-white">Wechselrichter</div>
                            <div class="text-xs text-purple-300 font-medium">+5 Wh/s</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-yellow-400 font-bold text-lg" id="inverter-cost">100 Wh</div>
                        <div class="text-xs text-slate-400 font-medium">Besitz: <span id="inverter-count" class="text-white">0</span></div>
                    </div>
                </button>
                
                <!-- Upgrade 3 -->
                <button id="buy-smart-btn" class="w-full flex justify-between items-center p-4 bg-slate-700/50 hover:bg-slate-600 rounded-xl transition border border-slate-600 disabled:opacity-50 disabled:cursor-not-allowed group">
                    <div class="flex items-center gap-4">
                        <div class="bg-cyan-900/50 p-2 rounded-lg text-cyan-400 group-hover:scale-110 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                            </svg>
                        </div>
                        <div class="text-left">
                            <div class="font-bold text-white">Smart Meter</div>
                            <div class="text-xs text-cyan-300 font-medium">Macht Klicks stärker (+1)</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-yellow-400 font-bold text-lg" id="smart-cost">250 Wh</div>
                        <div class="text-xs text-slate-400 font-medium">Besitz: <span id="smart-count" class="text-white">0</span></div>
                    </div>
                </button>
            </div>
        </div>

        <!-- Save/Load/Export Menu -->
        <div class="mt-10 pt-6 border-t border-slate-700">
            <h3 class="text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">System-Verwaltung</h3>
            <div class="flex flex-wrap gap-3 mb-4">
                <button id="save-btn" class="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 text-sm font-medium rounded-lg transition flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
                    Manuell Speichern
                </button>
                <button id="reset-btn" class="px-5 py-2.5 bg-red-900/40 hover:bg-red-800 text-red-300 text-sm font-medium rounded-lg transition flex items-center gap-2 border border-red-900/50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    Reset
                </button>
            </div>
            
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="save-code" class="flex-1 bg-slate-900 border border-slate-600 text-sm p-3 rounded-lg text-emerald-400 font-mono focus:outline-none focus:border-emerald-500" placeholder="Save-Code (Base64)...">
                <button id="export-btn" class="px-4 py-3 bg-blue-600 hover:bg-blue-500 text-sm font-semibold rounded-lg transition shadow-lg">Code kopieren</button>
                <button id="import-btn" class="px-4 py-3 bg-purple-600 hover:bg-purple-500 text-sm font-semibold rounded-lg transition shadow-lg">Code importieren</button>
            </div>
        </div>

    </div>

    <!-- Game Logic -->
    <script>
        // Game State Variables
        let game = {
            energy: 0,
            energyPerClick: 1,
            panels: 0,
            panelCost: 15,
            inverters: 0,
            inverterCost: 100,
            smartMeters: 0,
            smartCost: 250
        };

        // DOM Elements
        const energyDisplay = document.getElementById('energy-display');
        const epsDisplay = document.getElementById('eps-display');
        const clickBtn = document.getElementById('click-btn');
        
        const buyPanelBtn = document.getElementById('buy-panel-btn');
        const panelCostDisplay = document.getElementById('panel-cost');
        const panelCountDisplay = document.getElementById('panel-count');
        
        const buyInverterBtn = document.getElementById('buy-inverter-btn');
        const inverterCostDisplay = document.getElementById('inverter-cost');
        const inverterCountDisplay = document.getElementById('inverter-count');

        const buySmartBtn = document.getElementById('buy-smart-btn');
        const smartCostDisplay = document.getElementById('smart-cost');
        const smartCountDisplay = document.getElementById('smart-count');

        const saveCodeInput = document.getElementById('save-code');

        // Initial Load
        loadGame();

        // Game Loop
        setInterval(() => {
            let eps = calculateEPS();
            game.energy += eps / 10;
            updateUI();
        }, 100);

        // Auto Save
        setInterval(saveGame, 10000);

        // Click Action
        clickBtn.addEventListener('click', () => {
            game.energy += game.energyPerClick;
            updateUI();
        });

        // Buying Logic
        buyPanelBtn.addEventListener('click', () => {
            if (game.energy >= game.panelCost) {
                game.energy -= game.panelCost;
                game.panels++;
                game.panelCost = Math.floor(game.panelCost * 1.15);
                updateUI();
            }
        });

        buyInverterBtn.addEventListener('click', () => {
            if (game.energy >= game.inverterCost) {
                game.energy -= game.inverterCost;
                game.inverters++;
                game.inverterCost = Math.floor(game.inverterCost * 1.20);
                updateUI();
            }
        });

        buySmartBtn.addEventListener('click', () => {
            if (game.energy >= game.smartCost) {
                game.energy -= game.smartCost;
                game.smartMeters++;
                game.energyPerClick += 1;
                game.smartCost = Math.floor(game.smartCost * 1.50);
                updateUI();
            }
        });

        // Helper Functions
        function calculateEPS() {
            return (game.panels * 1) + (game.inverters * 5);
        }

        function updateUI() {
            energyDisplay.innerText = Math.floor(game.energy);
            epsDisplay.innerText = calculateEPS();
            
            panelCostDisplay.innerText = game.panelCost + " Wh";
            panelCountDisplay.innerText = game.panels;
            buyPanelBtn.disabled = game.energy < game.panelCost;

            inverterCostDisplay.innerText = game.inverterCost + " Wh";
            inverterCountDisplay.innerText = game.inverters;
            buyInverterBtn.disabled = game.energy < game.inverterCost;

            smartCostDisplay.innerText = game.smartCost + " Wh";
            smartCountDisplay.innerText = game.smartMeters;
            buySmartBtn.disabled = game.energy < game.smartCost;
        }

        // Save & Load Functions
        function saveGame() {
            localStorage.setItem('balkonkraftwerkSave', JSON.stringify(game));
        }

        function loadGame() {
            let savedGame = localStorage.getItem('balkonkraftwerkSave');
            if (savedGame) {
                game = JSON.parse(savedGame);
            }
            updateUI();
        }

        document.getElementById('save-btn').addEventListener('click', () => {
            saveGame();
            alert("Spiel manuell gespeichert!");
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            if(confirm("Bist du sicher? Dein Fortschritt wird komplett gelöscht!")) {
                localStorage.removeItem('balkonkraftwerkSave');
                location.reload();
            }
        });

        // Export & Import
        document.getElementById('export-btn').addEventListener('click', () => {
            let saveString = btoa(JSON.stringify(game));
            saveCodeInput.value = saveString;
            saveCodeInput.select();
            document.execCommand('copy');
            alert("Save-Code kopiert!");
        });

        document.getElementById('import-btn').addEventListener('click', () => {
            let code = saveCodeInput.value;
            if (!code) {
                alert("Bitte füge zuerst einen Code in das Feld ein.");
                return;
            }
            try {
                let decoded = atob(code);
                game = JSON.parse(decoded);
                saveGame();
                updateUI();
                alert("Spielstand erfolgreich geladen!");
            } catch (e) {
                alert("Fehlerhafter Code!");
            }
        });
    </script>
</body>
</html>
