<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jannik Biefel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <main class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-8 text-center shadow-xl space-y-6 relative overflow-hidden">
        
        <!-- Header / Profil -->
        <div>
            <div class="w-24 h-24 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full flex items-center justify-center text-4xl font-bold mx-auto mb-4 text-white shadow-[0_0_20px_rgba(59,130,246,0.5)] border-4 border-slate-800">
                JB
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Jannik Biefel</h1>
            <p class="text-blue-400 font-medium text-sm mt-1">Hardware Development & Engineering</p>
        </div>

        <!-- Kurze Info -->
        <p class="text-slate-300 text-sm leading-relaxed">
            Passion für Hardware, eingebettete Systeme & digitale Projekte.
        </p>

        <!-- Kontakt -->
        <div class="pt-4 border-t border-slate-700/60 space-y-3">
            <a href="mailto:jannik@biefel.de" class="flex items-center justify-center gap-2 w-full py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-semibold transition duration-200 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                E-Mail schreiben
            </a>
            
            <!-- Under Construction Button (Login) -->
            <button id="login-btn" class="flex items-center justify-center gap-2 w-full py-3 px-4 bg-amber-500/10 hover:bg-amber-500/20 text-amber-500 border border-amber-500/50 border-dashed rounded-xl text-sm font-semibold transition duration-200 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                🚧 WIP: Under Construction
            </button>
        </div>

        <!-- Verstecktes Passwort-Feld -->
        <div id="login-form" class="hidden absolute inset-0 bg-slate-800/95 backdrop-blur-sm flex flex-col items-center justify-center p-6 rounded-2xl z-10">
            <h3 class="text-white font-bold mb-4">Entwickler-Zugang</h3>
            <input type="password" id="password-input" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-center text-white mb-4 focus:outline-none focus:border-amber-500" placeholder="••••">
            <div class="flex gap-2 w-full">
                <button id="cancel-btn" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm transition">Abbrechen</button>
                <button id="submit-btn" class="flex-1 py-2 bg-amber-600 hover:bg-amber-500 text-slate-900 rounded-lg text-sm font-bold transition">Zugang</button>
            </div>
            <p id="error-msg" class="text-red-400 text-xs mt-3 hidden">Falscher Code!</p>
        </div>

        <!-- Footer -->
        <footer class="pt-4 text-xs text-slate-500">
            &copy; biefel.de
        </footer>
    </main>

    <script>
        const loginBtn = document.getElementById('login-btn');
        const loginForm = document.getElementById('login-form');
        const cancelBtn = document.getElementById('cancel-btn');
        const submitBtn = document.getElementById('submit-btn');
        const passwordInput = document.getElementById('password-input');
        const errorMsg = document.getElementById('error-msg');

        // NEUES PASSWORT
        const SECRET_PASSWORD = "4567"; 

        loginBtn.addEventListener('click', () => {
            loginForm.classList.remove('hidden');
            passwordInput.focus();
        });

        cancelBtn.addEventListener('click', () => {
            loginForm.classList.add('hidden');
            errorMsg.classList.add('hidden');
            passwordInput.value = '';
        });

        function checkPassword() {
            if (passwordInput.value === SECRET_PASSWORD) {
                window.location.href = "game.html";
            } else {
                errorMsg.classList.remove('hidden');
                passwordInput.value = '';
            }
        }

        submitBtn.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
